<svg xmlns="http://www.w3.org/2000/svg" width="720" height="124" viewBox="0 0 720 124" role="img" aria-labelledby="title desc">
  <title id="title">OpenSpec × Elephant-Goldfish Model</title>
  <desc id="desc">Unified Spec-Driven Development with Adversarial Zero-Context Peer Review</desc>
  <defs>
    <linearGradient id="openspecGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>
  <style>
    .title-text { fill: #0f172a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 800; letter-spacing: -0.8px; }
    .connector-text { fill: #64748b; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 300; }
    .sub-text { fill: #475569; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 500; font-size: 13px; letter-spacing: 0.2px; }
    .badge-bg { fill: #f1f5f9; stroke: #e2e8f0; }
    .elephant { fill: #1b6ef3; stroke: #1b6ef3; }
    .goldfish { fill: #e86e00; stroke: #e86e00; }

    @media (prefers-color-scheme: dark) {
      .title-text { fill: #f8fafc; }
      .connector-text { fill: #94a3b8; }
      .sub-text { fill: #94a3b8; }
      .badge-bg { fill: #1e293b; stroke: #334155; }
      .elephant { fill: #60a5fa; stroke: #60a5fa; }
      .goldfish { fill: #fb923c; stroke: #fb923c; }
    }
  </style>

  <!-- Left: OpenSpec Branding -->
  <g transform="translate(64, 22)">
    <!-- Document/Spec Icon with Gradient -->
    <g transform="translate(0, 4)">
      <rect x="0" y="0" width="36" height="44" rx="8" fill="url(#openspecGrad)"/>
      <path d="M10 14h16M10 22h16M10 30h10" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="27" cy="30" r="3" fill="#ffffff"/>
    </g>
    <!-- Brand Typography -->
    <text class="title-text" x="48" y="38" font-size="34">OpenSpec</text>
  </g>

  <!-- Middle Connector: × -->
  <text class="connector-text" x="312" y="58" font-size="28" text-anchor="middle">×</text>

  <!-- Right: EGM Branding -->
  <g transform="translate(376, 22)">
    <!-- Elephant & Goldfish Vector Icon -->
    <g transform="translate(0, -6) scale(2.8)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <g class="elephant">
        <path stroke="none" d="M10.30,6.80 A5.20,5.20 0 0 0 10.30,17.20 A1.20,1.20 0 0 0 11.50,16.00 L11.50,8.00 A1.20,1.20 0 0 0 10.30,6.80Z"/>
        <path fill="none" d="M7.20,12.00 C6.80,14.60 3.40,14.70 3.20,12.60 C3.10,11.20 3.30,10.20 3.60,9.40"/>
      </g>
      <g class="goldfish">
        <path stroke="none" d="M13.70,6.80 A5.20,5.20 0 0 1 13.70,17.20 A1.20,1.20 0 0 1 12.50,16.00 L12.50,8.00 A1.20,1.20 0 0 1 13.70,6.80Z"/>
        <path fill="none" d="M16.80,12.00 L18.00,12.00 C18.80,12.00 19.40,10.60 20.90,9.40 M18.00,12.00 C18.80,12.00 19.40,13.40 20.90,14.60"/>
      </g>
    </g>
    <!-- Brand Typography -->
    <text class="title-text" x="76" y="38" font-size="34">EGM</text>
    <rect class="badge-bg" x="156" y="16" width="94" height="26" rx="6" stroke-width="1"/>
    <text x="203" y="33" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#1b6ef3" text-anchor="middle" letter-spacing="0.5">SCHEMA</text>
  </g>

  <!-- Bottom Divider Line -->
  <line x1="60" y1="84" x2="660" y2="84" stroke="currentColor" opacity="0.12" stroke-width="1"/>

  <!-- Bottom Subtitle -->
  <text class="sub-text" x="360" y="108" text-anchor="middle">
    Design with an Elephant &bull; Review with a Goldfish &bull; Compound with Living Specs
  </text>
</svg>
